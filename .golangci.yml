run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable-all: false
  enable:
    # Core linters required by Constitution
    - gofmt      # Format code according to gofmt
    - govet      # Run go vet
    - ineffassign # Detect ineffectual assignments
    - misspell   # Fix spelling mistakes
    - unconvert  # Remove unnecessary type conversions

    # Additional quality linters
    - bodyclose  # Check whether HTTP response bodies are closed
    - errcheck   # Check for unchecked errors
    - exhaustive # Check exhaustiveness of enum switch statements
    - gosec      # Security problems
    - gosimple   # Simplify code
    - staticcheck # Static analysis
    - typecheck  # Type checking
    - unused     # Find unused code
    - whitespace # Detect whitespace issues
    - prealloc   # Find slice declarations that could be preallocated
    - revive     # Replacement for golint
    - mnd        # Magic number detection (replacement for gomnd)
    - exportloopref # Replacement for scopelint

    # Style and complexity
    - dupl       # Code duplication
    - funlen     # Function length
    - gocyclo    # Cyclomatic complexity
    - goconst    # Find repeated strings that could be constants
    - gocritic   # Various code style checks
    - goimports  # Check import statements
    - lll        # Line length limit
    - nakedret   # Find naked returns
    - nolintlint # Reports ill-formed or insufficient nolint directives
    - stylecheck # Style checker
    - unparam    # Find unused parameters

linters-settings:
  dupl:
    threshold: 100
  exhaustive:
    default-signifies-exhaustive: false
  funlen:
    lines: 100
    statements: 50
  gocyclo:
    min-complexity: 15
  mnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign
  govet:
    enable:
      - shadow
  lll:
    line-length: 140
  misspell:
    locale: US
  nolintlint:
    allow-leading-space: false
    allow-unused: false
    require-explanation: true
    require-specific: true
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: package-comments

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - mnd
        - funlen
        - dupl
    - path: internal/
      linters:
        - unused
    - path: examples/
      linters:
        - mnd
        - funlen

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true